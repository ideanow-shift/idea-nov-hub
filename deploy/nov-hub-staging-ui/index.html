<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>NOV HUB Staging | 店舗営業管理</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main>
    <p class="environment">NOV HUB STAGING</p>
    <h1>NOV HUB</h1>
    <section id="login" class="panel" aria-labelledby="login-title">
      <h2 id="login-title">Stagingへログイン</h2>
      <button id="google-login" type="button">Googleでログイン</button>
    </section>
    <section id="portal" class="panel" hidden aria-labelledby="app-title">
      <h2 id="app-title">店舗営業管理</h2>
      <p>売上・利益・KPI・店舗運営を確認</p>
      <button id="launch" type="button">店舗営業管理を開く</button>
      <button id="logout" class="secondary" type="button">ログアウト</button>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
    <p class="notice">ここは社内UAT用の非Production環境です。</p>
  </main>
  <script src="./enrollment-bootstrap.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
