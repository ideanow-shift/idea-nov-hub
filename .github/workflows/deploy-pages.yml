name: Deploy NOV HUB to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      production_approved:
        description: "Explicit production deployment approval"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ inputs.production_approved == true }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload portal
        uses: actions/upload-pages-artifact@v3
        with:
          path: portal

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
