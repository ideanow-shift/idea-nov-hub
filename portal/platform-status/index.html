<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Platform Status | IDEA NOV</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar"><div><p class="eyebrow">IDEA NOV PLATFORM</p><h1>Platform Status</h1></div><p class="updated">最終更新: <time id="updated-at"></time></p></header>
    <section class="summary" aria-label="判定の基準"><div class="summary__item"><span>Release Ready</span><strong>5条件すべてPASS</strong></div><div class="summary__item"><span>対象領域</span><strong>7 systems</strong></div><div class="summary__item"><span>更新単位</span><strong>証拠と次の判断</strong></div></section>
    <div class="controls" aria-label="表示の絞り込み"><button type="button" data-filter="all" aria-pressed="true">全体</button><button type="button" data-filter="action" aria-pressed="false">要対応</button><button type="button" data-filter="unverified" aria-pressed="false">未確認あり</button></div>
    <section class="workspace" aria-label="Platform status detail"><div class="table-wrap"><table><thead><tr><th scope="col">領域</th><th scope="col">データ整合性</th><th scope="col">業務フロー</th><th scope="col">UI/UX</th><th scope="col">Release</th></tr></thead><tbody id="status-body"></tbody></table></div><aside id="detail-panel" class="detail" aria-live="polite"></aside></section>
  </main>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
