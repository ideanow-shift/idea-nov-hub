name: Deploy NOV HUB to GitHub Pages

on:
  pull_request:
    paths:
      - ".github/workflows/deploy-pages.yml"
      - "docs/nov_talent/**"
      - "contracts/nov-talent/**"
      - "portal/index.html"
      - "portal/js/**"
      - "portal/talent/**"
      - "portal/store-sales/**"
      - "docs/store_operations_management/production_release/**"
      - "tests/**talent**"
      - "tests/store-sales-*.test.mjs"
      - "tests/store-operations-*.test.mjs"
      - "tests/dbf-store-monthly-*.test.mjs"
      - "tests/nov-navi-dashboard-boundary.test.mjs"
      - "tests/management-store-csv-requirements.test.mjs"
      - "scripts/generate-nov-talent-workspace-contract.mjs"
      - "scripts/generate-nov-talent-selection-coverage-contract.mjs"
      - "scripts/generate-nov-talent-daily-workflow-contract.mjs"
      - "tools/nov-talent-e2e/**"
  workflow_dispatch:
    inputs:
      production_approved:
        description: "Explicit production deployment approval"
        required: true
        type: boolean
        default: false
      store_operations_release_approved:
        description: "Explicit Store Operations production release approval"
        required: true
        type: boolean
        default: false
      store_operations_main_sha:
        description: "Approved main SHA for Store Operations release"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  talent-release-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find portal/talent -maxdepth 1 -type f \( -name '*.mjs' -o -name '*.js' \) -print0 \
            | xargs -0 -n1 node --check
          find portal/talent/generated -type f -name '*.mjs' -print0 \
            | xargs -0 -n1 node --check
          test ! -f portal/js/nov-talent-access.js || node --check portal/js/nov-talent-access.js

      - name: Check generated Workspace Contract v1
        shell: bash
        run: |
          node scripts/generate-nov-talent-workspace-contract.mjs --check
          node scripts/generate-nov-talent-selection-coverage-contract.mjs --check
          node scripts/generate-nov-talent-daily-workflow-contract.mjs --check

      - name: Run NOV Talent and HUB fixed regressions
        shell: bash
        run: |
          mapfile -t tests < <(
            find tests -maxdepth 1 -type f \
              \( -name '*talent*.test.mjs' \
                 -o -name 'nov-navi-dashboard-boundary.test.mjs' \
                 -o -name 'management-store-csv-requirements.test.mjs' \) \
              ! -name '*.playwright.mjs' \
              | sort
          )
          node --test "${tests[@]}"

      - name: Run authenticated Workspace browser release gate
        shell: bash
        run: |
          npm ci --prefix tools/nov-talent-e2e
          ./tools/nov-talent-e2e/node_modules/.bin/playwright install --with-deps chromium
          PLAYWRIGHT_PACKAGE_DIR="$PWD/tools/nov-talent-e2e/node_modules/playwright-core" \
            node tests/nov-talent-workspace-release-gate.playwright.mjs

      - name: Check patch whitespace
        shell: bash
        run: git diff --check origin/main...HEAD

      - name: Reject committed secrets
        shell: bash
        run: |
          if git grep -nEI \
            '(sb_secret_|postgres(ql)?://[^[:space:]]+:[^@[:space:]]+@|eyJ[A-Za-z0-9_-]{20,}\.)' \
            -- portal/talent; then
            echo "Potential secret material found in NOV Talent assets."
            exit 1
          fi

  store-operations-release-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify approved source and target
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.store_operations_release_approved }}" == "true" ]]; then
            test -n "${{ inputs.store_operations_main_sha }}"
            test "$(git rev-parse HEAD)" = "${{ inputs.store_operations_main_sha }}"
          fi
          grep -q 'expectedProjectRef: "nkmxevmioczcmnldreyo"' portal/store-sales/runtime-config.production.js
          grep -q 'STORE_MONTHLY_ACTUAL_V1' portal/store-sales/runtime-config.production.js
      - name: Run Store Operations release regressions
        shell: bash
        run: |
          node --check portal/store-sales/app.js
          find portal/store-sales -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          mapfile -t store_tests < <(
            find tests -maxdepth 1 -type f \
              \( -name 'store-sales-*.test.mjs' -o -name 'store-operations-*.test.mjs' -o -name 'dbf-store-monthly-*.test.mjs' \) \
              ! -name '*eol-integrity.test.mjs' \
              | sort
          )
          node --test --test-concurrency=1 "${store_tests[@]}"
      - name: Reject Store Operations secrets and production fixtures
        shell: bash
        run: |
          ! grep -R -E 'sb_secret_|SUPABASE_SERVICE_ROLE_KEY=.+|BEGIN (RSA|OPENSSH) PRIVATE KEY' portal/store-sales
          ! grep -Ei 'mock|synthetic' portal/store-sales/runtime-config.production.js
      - name: Check patch whitespace
        shell: bash
        run: git diff --check origin/main...HEAD

      - name: Reject Production Mock Identity
        shell: bash
        run: |
          node --test tests/nov-talent-sprint1-mock-runtime.test.mjs
          if test -f tests/nov-talent-hub-launch-integration.test.mjs; then
            node --test tests/nov-talent-hub-launch-integration.test.mjs
          fi

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.production_approved == true }}
    needs: [talent-release-checks, store-operations-release-checks]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Activate approved Store Operations production config
        if: ${{ inputs.store_operations_release_approved == true }}
        shell: bash
        run: cp portal/store-sales/runtime-config.production.js portal/store-sales/runtime-config.js

      - name: Upload portal
        uses: actions/upload-pages-artifact@v3
        with:
          path: portal

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
