name: CTO Priority Lock

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify CTO portfolio execution order
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate priority lock and PR authorization marker
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/verify-cto-priority-lock.mjs
