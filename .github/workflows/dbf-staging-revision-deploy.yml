name: DBF Staging Revision Deploy

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Full 40-character commit SHA at the current main HEAD"
        required: true
        type: string
      image_digest:
        description: "Immutable sha256 digest produced by DBF Staging Image Push"
        required: true
        type: string
      confirmation:
        description: "Type DEPLOY_DBF_STAGING_REVISION_<full source SHA>"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: dbf-staging-revision-deploy
  cancel-in-progress: false

jobs:
  deploy-revision:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dbf-business-data-staging
    env:
      APPROVED_SOURCE_SHA: ${{ github.event.inputs.source_sha }}
      APPROVED_IMAGE_DIGEST: ${{ github.event.inputs.image_digest }}
      GCP_PROJECT_ID: idea-nov-dbf-staging
      GCP_PROJECT_NUMBER: "787968950888"
      GCP_REGION: asia-northeast1
      ARTIFACT_REPOSITORY: idea-nov-dbf-staging-ui
      IMAGE_NAME: dbf-staging-ui
      CLOUD_RUN_SERVICE: idea-nov-dbf-staging-ui
      EXPECTED_RUNTIME_SA: dbf-staging-ui-runtime@idea-nov-dbf-staging.iam.gserviceaccount.com

    steps:
      - name: Exact request gate
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.repository_id }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_CONFIRMATION: ${{ github.event.inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$EVENT_REPOSITORY" = "ideanow-shift/idea-nov-hub"
          test "$EVENT_REPOSITORY_ID" = "1270075168"
          test "$EVENT_REF" = "refs/heads/main"
          test "$EVENT_NAME" = "workflow_dispatch"
          printf '%s' "$EVENT_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$APPROVED_SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$APPROVED_IMAGE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
          test "$EVENT_CONFIRMATION" = "DEPLOY_DBF_STAGING_REVISION_$APPROVED_SOURCE_SHA"

      - name: Authenticate to Google Cloud with existing WIF
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: projects/787968950888/locations/global/workloadIdentityPools/github-dbf-staging/providers/github-idea-nov-hub
          service_account: dbf-staging-deployer@idea-nov-dbf-staging.iam.gserviceaccount.com
          project_id: idea-nov-dbf-staging
          create_credentials_file: true
          cleanup_credentials: true

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: idea-nov-dbf-staging

      - name: Fail-close target and rollback preflight
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          assert_eq() {
            local label="$1" expected="$2" actual="$3"
            if [ "$actual" != "$expected" ]; then
              echo "::error title=DBF preflight mismatch::$label expected=$expected actual=$actual"
              exit 1
            fi
            echo "DBF_PREFLIGHT $label=$actual"
          }
          assert_nonempty() {
            local label="$1" actual="$2"
            if [ -z "$actual" ]; then
              echo "::error title=DBF preflight mismatch::$label is empty"
              exit 1
            fi
            echo "DBF_PREFLIGHT $label=$actual"
          }
          assert_positive_integer() {
            local label="$1" actual="$2"
            if ! printf '%s' "$actual" | grep -Eq '^[1-9][0-9]*$'; then
              echo "::error title=DBF preflight mismatch::$label must be a positive integer; actual=$actual"
              exit 1
            fi
            echo "DBF_PREFLIGHT $label=$actual"
          }
          assert_eq project "$GCP_PROJECT_ID" "$(gcloud config get-value project 2>/dev/null)"
          assert_eq project_number "$GCP_PROJECT_NUMBER" "$(gcloud projects describe "$GCP_PROJECT_ID" --format='value(projectNumber)')"
          assert_eq active_account "dbf-staging-deployer@idea-nov-dbf-staging.iam.gserviceaccount.com" "$(gcloud auth list --filter=status:ACTIVE --format='value(account)')"

          image_ref="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/$IMAGE_NAME@$APPROVED_IMAGE_DIGEST"
          gcloud artifacts docker images describe "$image_ref" --project="$GCP_PROJECT_ID" --format=json > "$RUNNER_TEMP/image.json"
          assert_eq image_digest "$APPROVED_IMAGE_DIGEST" "$(jq -r '.image_summary.digest // .imageSummary.digest // .digest // empty' "$RUNNER_TEMP/image.json")"
          tag_ref="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/$IMAGE_NAME:$APPROVED_SOURCE_SHA"
          gcloud artifacts docker images describe "$tag_ref" --project="$GCP_PROJECT_ID" --format=json > "$RUNNER_TEMP/tag.json"
          assert_eq tag_digest "$APPROVED_IMAGE_DIGEST" "$(jq -r '.image_summary.digest // .imageSummary.digest // .digest // empty' "$RUNNER_TEMP/tag.json")"

          gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json > "$RUNNER_TEMP/service-before.json"
          rollback_revision="$(jq -r '.status.traffic[0].revisionName' "$RUNNER_TEMP/service-before.json")"
          assert_nonempty rollback_revision "$rollback_revision"
          assert_eq traffic_count "1" "$(jq -r '.status.traffic | length' "$RUNNER_TEMP/service-before.json")"
          assert_eq traffic_percent "100" "$(jq -r '.status.traffic[0].percent' "$RUNNER_TEMP/service-before.json")"
          assert_eq iap_enabled "true" "$(jq -r '.metadata.annotations["run.googleapis.com/iap-enabled"]' "$RUNNER_TEMP/service-before.json")"
          assert_eq ingress "all" "$(jq -r '.metadata.annotations["run.googleapis.com/ingress"]' "$RUNNER_TEMP/service-before.json")"
          assert_eq runtime_service_account "$EXPECTED_RUNTIME_SA" "$(jq -r '.spec.template.spec.serviceAccountName' "$RUNNER_TEMP/service-before.json")"
          assert_eq container_port "8080" "$(jq -r '.spec.template.spec.containers[0].ports[0].containerPort' "$RUNNER_TEMP/service-before.json")"
          min_instances="$(jq -r '.spec.template.metadata.annotations["autoscaling.knative.dev/minScale"] // .spec.template.scaling.minInstanceCount // .metadata.annotations["run.googleapis.com/minScale"] // "0"' "$RUNNER_TEMP/service-before.json")"
          max_instances="$(jq -r '.spec.template.metadata.annotations["autoscaling.knative.dev/maxScale"] // .spec.template.scaling.maxInstanceCount // .metadata.annotations["run.googleapis.com/maxScale"] // empty' "$RUNNER_TEMP/service-before.json")"
          assert_eq min_instances "0" "$min_instances"
          assert_positive_integer rollback_max_instances "$max_instances"
          gcloud run revisions describe "$rollback_revision" \
            --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json > "$RUNNER_TEMP/rollback-revision.json"
          assert_eq rollback_ready "True" "$(jq -r '[.status.conditions[]? | select(.type == "Ready")][0].status' "$RUNNER_TEMP/rollback-revision.json")"
          gcloud run services get-iam-policy "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json > "$RUNNER_TEMP/iam-before.json"
          assert_eq public_iam_bindings "0" "$(jq '[.bindings[]? | select(any(.members[]?; . == "allUsers" or . == "allAuthenticatedUsers"))] | length' "$RUNNER_TEMP/iam-before.json")"
          echo "rollback_revision=$rollback_revision" >> "$GITHUB_OUTPUT"
          echo "rollback_max_instances=$max_instances" >> "$GITHUB_OUTPUT"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"

      - name: Create candidate revision with zero traffic
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services update "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --image="${{ steps.preflight.outputs.image_ref }}" \
            --min=0 \
            --max=1 \
            --no-traffic \
            --quiet

      - name: Verify candidate and switch traffic
        id: rollout
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json > "$RUNNER_TEMP/service-candidate.json"
          new_revision="$(jq -r '.status.latestCreatedRevisionName' "$RUNNER_TEMP/service-candidate.json")"
          test "$new_revision" != ""
          test "$new_revision" != "${{ steps.preflight.outputs.rollback_revision }}"
          test "$(jq -r '.status.traffic[0].revisionName' "$RUNNER_TEMP/service-candidate.json")" = "${{ steps.preflight.outputs.rollback_revision }}"
          test "$(jq -r '.status.traffic[0].percent' "$RUNNER_TEMP/service-candidate.json")" = "100"
          gcloud run revisions describe "$new_revision" \
            --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json > "$RUNNER_TEMP/new-revision.json"
          test "$(jq -r '[.status.conditions[]? | select(.type == "Ready")][0].status' "$RUNNER_TEMP/new-revision.json")" = "True"
          test "$(jq -r '.spec.serviceAccountName' "$RUNNER_TEMP/new-revision.json")" = "$EXPECTED_RUNTIME_SA"
          test "$(jq -r '.spec.containers[0].image' "$RUNNER_TEMP/new-revision.json")" = "${{ steps.preflight.outputs.image_ref }}"
          test "$(jq -r '.spec.containers[0].ports[0].containerPort' "$RUNNER_TEMP/new-revision.json")" = "8080"
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" --region="$GCP_REGION" \
            --to-revisions="$new_revision=100" --quiet
          echo "new_revision=$new_revision" >> "$GITHUB_OUTPUT"

      - name: Read back hosted security invariants
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json > "$RUNNER_TEMP/service-after.json"
          serving_traffic_count="$(jq '[.status.traffic[]? | select((.percent // 0) > 0)] | length' "$RUNNER_TEMP/service-after.json")"
          serving_revision="$(jq -r '[.status.traffic[]? | select((.percent // 0) > 0)][0].revisionName // empty' "$RUNNER_TEMP/service-after.json")"
          serving_percent="$(jq -r '[.status.traffic[]? | select((.percent // 0) > 0)][0].percent // empty' "$RUNNER_TEMP/service-after.json")"
          test "$serving_traffic_count" = "1"
          test "$serving_revision" = "${{ steps.rollout.outputs.new_revision }}"
          test "$serving_percent" = "100"
          test "$(jq -r '.metadata.annotations["run.googleapis.com/iap-enabled"]' "$RUNNER_TEMP/service-after.json")" = "true"
          test "$(jq -r '.metadata.annotations["run.googleapis.com/ingress"]' "$RUNNER_TEMP/service-after.json")" = "all"
          test "$(jq -r '.spec.template.spec.serviceAccountName' "$RUNNER_TEMP/service-after.json")" = "$EXPECTED_RUNTIME_SA"
          test "$(jq -r '.spec.template.spec.containers[0].ports[0].containerPort' "$RUNNER_TEMP/service-after.json")" = "8080"
          min_instances="$(jq -r '.spec.template.metadata.annotations["autoscaling.knative.dev/minScale"] // .spec.template.scaling.minInstanceCount // .metadata.annotations["run.googleapis.com/minScale"] // "0"' "$RUNNER_TEMP/service-after.json")"
          max_instances="$(jq -r '.spec.template.metadata.annotations["autoscaling.knative.dev/maxScale"] // .spec.template.scaling.maxInstanceCount // .metadata.annotations["run.googleapis.com/maxScale"] // empty' "$RUNNER_TEMP/service-after.json")"
          test "$min_instances" = "0"
          test "$max_instances" = "1"
          gcloud run services get-iam-policy "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json > "$RUNNER_TEMP/iam-after.json"
          test "$(jq '[.bindings[]? | select(any(.members[]?; . == "allUsers" or . == "allAuthenticatedUsers"))] | length' "$RUNNER_TEMP/iam-after.json")" = "0"
          service_url="$(jq -r '.status.url' "$RUNNER_TEMP/service-after.json")"
          unauthenticated_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 20 "$service_url/management-app/")"
          test "$unauthenticated_status" != "200"
          {
            echo "## DBF Hosted Staging revision"
            echo "- Source: $APPROVED_SOURCE_SHA"
            echo "- Digest: $APPROVED_IMAGE_DIGEST"
            echo "- Rollback revision: ${{ steps.preflight.outputs.rollback_revision }}"
            echo "- Previous max instances: ${{ steps.preflight.outputs.rollback_max_instances }}"
            echo "- Serving revision: ${{ steps.rollout.outputs.new_revision }}"
            echo "- Serving min/max instances: 0/1"
            echo "- IAP: enabled"
            echo "- Ingress: all"
            echo "- Public IAM: 0"
            echo "- Unauthenticated HTTP: $unauthenticated_status"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Roll back traffic after a failed rollout
        if: failure() && steps.preflight.outputs.rollback_revision != ''
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" --region="$GCP_REGION" \
            --to-revisions="${{ steps.preflight.outputs.rollback_revision }}=100" --quiet
          gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json > "$RUNNER_TEMP/service-rollback.json"
          serving_traffic_count="$(jq '[.status.traffic[]? | select((.percent // 0) > 0)] | length' "$RUNNER_TEMP/service-rollback.json")"
          serving_revision="$(jq -r '[.status.traffic[]? | select((.percent // 0) > 0)][0].revisionName // empty' "$RUNNER_TEMP/service-rollback.json")"
          serving_percent="$(jq -r '[.status.traffic[]? | select((.percent // 0) > 0)][0].percent // empty' "$RUNNER_TEMP/service-rollback.json")"
          test "$serving_traffic_count" = "1"
          test "$serving_revision" = "${{ steps.preflight.outputs.rollback_revision }}"
          test "$serving_percent" = "100"
          test "$(jq -r '.metadata.annotations["run.googleapis.com/iap-enabled"]' "$RUNNER_TEMP/service-rollback.json")" = "true"
          test "$(jq -r '.metadata.annotations["run.googleapis.com/ingress"]' "$RUNNER_TEMP/service-rollback.json")" = "all"
