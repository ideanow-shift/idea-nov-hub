<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>緊急連絡先 UI fixture</title>
  <link rel="stylesheet" href="../../portal/master-admin/master-admin.css">
  <style>
    body { margin: 0; background: #FAFAFA; }
    .fixture-shell { width: min(760px, calc(100% - 32px)); margin: 32px auto; }
  </style>
</head>
<body>
  <main class="fixture-shell">
    <details class="employee-detail-section" id="employee-section-emergency" open>
      <summary>
        <span>
          <strong>緊急連絡先</strong>
          <small>災害・緊急時の本人連絡先</small>
        </span>
        <span class="section-status-badge neutral">未登録</span>
      </summary>
      <div class="employee-detail-section-body">
        <section class="employee-emergency-contact-panel" id="employee-emergency-contact-panel">
          <div>
            <strong>緊急連絡先</strong>
            <p>災害・緊急時の安否確認に使用する本人の電話番号です。</p>
          </div>
          <label class="form-field" for="employee_emergency_phone">
            <span>電話番号</span>
            <input class="form-input" id="employee_emergency_phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="24" placeholder="例: 090-1234-5678">
          </label>
          <p class="field-help">社員一覧・CSVには表示しません。家族等の緊急連絡先とは別の、本人への連絡先です。</p>
          <div class="employee-emergency-contact-actions">
            <span class="save-status" aria-live="polite"></span>
            <button class="button button-primary" type="button">保存</button>
          </div>
        </section>
      </div>
    </details>
  </main>
</body>
</html>
